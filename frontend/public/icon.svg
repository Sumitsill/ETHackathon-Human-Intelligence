<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#020617;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a3e635;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4d7c0f;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#grad1)" stroke="#1e293b" stroke-width="12"/>
  
  <!-- Neural connections grid (glow) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#a3e635" stroke-width="2" stroke-opacity="0.15" stroke-dasharray="10 10"/>
  <circle cx="256" cy="256" r="100" fill="none" stroke="#a3e635" stroke-width="2" stroke-opacity="0.1" stroke-dasharray="5 5"/>

  <!-- Logo Shape: ET + Network node -->
  <g transform="translate(128, 128)">
    <!-- Intersecting brain lines -->
    <path d="M56 128 L200 128 M128 56 L128 200" stroke="url(#grad2)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Central Node -->
    <circle cx="128" cy="128" r="48" fill="#1e293b" stroke="#a3e635" stroke-width="12"/>
    
    <!-- Outer Orbiting Nodes -->
    <circle cx="56" cy="128" r="20" fill="#a3e635"/>
    <circle cx="200" cy="128" r="20" fill="#a3e635"/>
    <circle cx="128" cy="56" r="20" fill="#a3e635"/>
    <circle cx="128" cy="200" r="20" fill="#a3e635"/>
    
    <!-- Pulse text in center -->
    <text x="128" y="135" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">ET</text>
  </g>
</svg>
